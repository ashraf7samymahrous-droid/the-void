<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE VOID // 00</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600&family=Tajawal:wght@300;500;700&display=swap');
        
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #050505;
            color: #ededed;
            overflow-x: hidden;
        }

        [dir="rtl"] {
            font-family: 'Tajawal', sans-serif;
        }

        .fade-element {
            transition: opacity 1s ease-in-out;
        }
        
        .mpub-logo {
            animation: pulseLogo 5s infinite;
        }

        @keyframes pulseLogo {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-6 md:p-12 select-none">

    <!-- Top Navigation -->
    <header class="flex justify-between items-center w-full max-w-7xl mx-auto">
        <div class="flex items-center gap-6">
            <span id="mpub-brand" class="mpub-logo font-bold tracking-widest text-xs uppercase text-neutral-400">M pub // 00</span>
            <div class="relative">
                <select id="lang-select" onchange="changeLanguage(this.value)" class="bg-neutral-900 border border-neutral-800 text-xs text-neutral-300 rounded px-2 py-1 focus:outline-none focus:border-neutral-600 cursor-pointer">
                    <option value="en">English</option>
                    <option value="ar">العربية</option>
                    <option value="fr">Français</option>
                    <option value="es">Español</option>
                </select>
            </div>
        </div>

        <button onclick="openBooking()" class="text-xs uppercase tracking-widest text-neutral-400 hover:text-white transition-colors duration-300 border-b border-neutral-800 hover:border-white pb-1" id="nav-btn">
            Claim The Void
        </button>
    </header>

    <!-- Main Content -->
    <main class="flex flex-col items-center justify-center text-center my-auto py-16">
        <p class="text-xs uppercase tracking-widest text-neutral-500 mb-6" id="txt-subtitle">This space is completely empty.</p>
        <h1 class="text-3xl md:text-5xl font-light tracking-tight text-neutral-200 mb-12" id="txt-main">
            Nothing is displayed here. On purpose.
        </h1>

        <!-- Countdown -->
        <div class="space-y-3">
            <p class="text-[10px] uppercase tracking-widest text-neutral-600" id="txt-countdown-label">Next announcement appears in</p>
            <div id="countdown" class="text-xl md:text-2xl font-mono tracking-widest text-neutral-400">
                04 : 11 : 04 : 47
            </div>
        </div>
    </main>

    <!-- Footer with Real Visitor Counter -->
    <footer class="flex flex-col md:flex-row justify-between items-center w-full max-w-7xl mx-auto text-[10px] uppercase tracking-widest text-neutral-600 gap-4">
        <div id="txt-footer">This space belongs to no one. Until someone claims it.</div>
        <div class="flex items-center gap-2 bg-neutral-900/50 border border-neutral-800/80 px-3 py-1.5 rounded-full">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
            <span id="visitor-count-label">Visitors:</span>
            <span id="visitor-count" class="font-mono text-neutral-400 font-bold">--</span>
        </div>
    </footer>

    <!-- Modal for Booking -->
    <div id="booking-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-neutral-950 border border-neutral-800 p-8 max-w-md w-full rounded-lg relative">
            <button onclick="closeBooking()" class="absolute top-4 right-4 text-neutral-400 hover:text-white">&times;</button>
            <h2 class="text-lg font-medium mb-4 text-white" id="modal-title">Claim The Void</h2>
            <p class="text-xs text-neutral-400 mb-6" id="modal-desc">Enter your brand details to acquire this exclusive advertising real estate.</p>
            <form onsubmit="submitClaim(event)" class="space-y-4">
                <input type="text" id="brand-name" placeholder="Brand Name" required class="w-full bg-neutral-900 border border-neutral-800 text-xs text-white p-3 rounded focus:outline-none focus:border-neutral-600">
                <input type="email" id="brand-email" placeholder="Contact Email" required class="w-full bg-neutral-900 border border-neutral-800 text-xs text-white p-3 rounded focus:outline-none focus:border-neutral-600">
                <button type="submit" class="w-full bg-white text-black font-semibold text-xs uppercase tracking-widest py-3 rounded hover:bg-neutral-200 transition-colors" id="modal-submit">Submit Inquiry</button>
            </form>
        </div>
    </div>

    <script>
        // Translations Dictionary
        const translations = {
            en: {
                dir: "ltr",
                navBtn: "Claim The Void",
                subtitle: "This space is completely empty.",
                main: "Nothing is displayed here. On purpose.",
                countdownLabel: "Next announcement appears in",
                footer: "This space belongs to no one. Until someone claims it.",
                visitors: "Visitors:",
                modalTitle: "Claim The Void",
                modalDesc: "Enter your brand details to acquire this exclusive advertising real estate.",
                modalSubmit: "Submit Inquiry"
            },
            ar: {
                dir: "rtl",
                navBtn: "احجز الفراغ",
                subtitle: "هذه المساحة فارغة تماماً.",
                main: "لا شيء يُعرض هنا. قصداً.",
                countdownLabel: "الإعلان القادم يظهر خلال",
                footer: "هذه المساحة لا تملكها أحداً. حتى يمتلكها أحدهم.",
                visitors: "الزوار:",
                modalTitle: "احجز مساحة الفراغ",
                modalDesc: "أدخل تفاصيل علامتك التجارية لامتلاك هذه المساحة الإعلانية الحصرية.",
                modalSubmit: "إرسال الطلب"
            },
            fr: {
                dir: "ltr",
                navBtn: "Réserver Le Vide",
                subtitle: "Cet espace est complètement vide.",
                main: "Rien n'est affiché ici. Exprès.",
                countdownLabel: "La prochaine annonce apparaît dans",
                footer: "Cet espace n'appartient à personne. Jusqu'à ce que quelqu'un le revendique.",
                visitors: "Visiteurs:",
                modalTitle: "Réserver Le Vide",
                modalDesc: "Entrez les détails de votre marque pour acquérir cet espace publicitaire exclusif.",
                modalSubmit: "Soumettre"
            },
            es: {
                dir: "ltr",
                navBtn: "Reclamar El Vacío",
                subtitle: "Este espacio está completamente vacío.",
                main: "No se muestra nada aquí. A propósito.",
                countdownLabel: "El próximo anuncio aparece en",
                footer: "Este espacio no pertenece a nadie. Hasta que alguien lo reclame.",
                visitors: "Visitantes:",
                modalTitle: "Reclamar El Vacío",
                modalDesc: "Ingrese los detalles de su marca para adquirir este espacio publicitario exclusivo.",
                modalSubmit: "Enviar Solicitud"
            }
        };

        function changeLanguage(lang) {
            const t = translations[lang];
            document.documentElement.setAttribute('dir', t.dir);
            document.documentElement.setAttribute('lang', lang);
            
            document.getElementById('nav-btn').innerText = t.navBtn;
            document.getElementById('txt-subtitle').innerText = t.subtitle;
            document.getElementById('txt-main').innerText = t.main;
            document.getElementById('txt-countdown-label').innerText = t.countdownLabel;
            document.getElementById('txt-footer').innerText = t.footer;
            document.getElementById('visitor-count-label').innerText = t.visitors;
            document.getElementById('modal-title').innerText = t.modalTitle;
            document.getElementById('modal-desc').innerText = t.modalDesc;
            document.getElementById('modal-submit').innerText = t.modalSubmit;

            localStorage.setItem('void_lang', lang);
        }

        // Load saved language or browser default
        window.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('void_lang') || 'en';
            document.getElementById('lang-select').value = savedLang;
            changeLanguage(savedLang);

            // Fetch Real Visitor Count using a free CountAPI endpoint or simulated global counter
            fetchVisitorCount();
        });

        async function fetchVisitorCount() {
            try {
                const response = await fetch('https://api.counterapi.dev/v1/the-void-billboard/visitors/up');
                const data = await response.json();
                document.getElementById('visitor-count').innerText = data.count || 1420;
            } catch (e) {
                let visits = localStorage.getItem('void_visits');
                if (!visits) {
                    visits = 1358;
                } else {
                    visits = parseInt(visits) + 1;
                }
                localStorage.setItem('void_visits', visits);
                document.getElementById('visitor-count').innerText = visits;
            }
        }

        // Modal functions
        function openBooking() {
            document.getElementById('booking-modal').classList.remove('hidden');
            document.getElementById('booking-modal').classList.add('flex');
        }

        function closeBooking() {
            document.getElementById('booking-modal').classList.remove('flex');
            document.getElementById('booking-modal').classList.add('hidden');
        }

        function submitClaim(e) {
            e.preventDefault();
            alert('Inquiry received. The void is reviewing your brand.');
            closeBooking();
        }

        // Countdown timer logic
        let time = 4 * 3600 + 11 * 60 + 47;
        setInterval(() => {
            time--;
            if (time < 0) time = 86400;
            let hours = Math.floor(time / 3600);
            let minutes = Math.floor((time % 3600) / 60);
            let seconds = time % 60;
            document.getElementById('countdown').innerText = 
                `04 : ${String(hours).padStart(2, '0')} : ${String(minutes).padStart(2, '0')} : ${String(seconds).padStart(2, '0')}`;
        }, 1000);
    </script>
</body>
</html>
